name: Build and Push Python Container

# One Dockerfile, one matrix → one image with per-version tags.
# Adding a new Python version = adding it to `matrix.python` below.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra tag suffix (e.g. dated snapshot 2026-04-19)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          # Always: a per-version pinned tag. e.g. :py3.12
          tags="ghcr.io/fabbs-tech/python-container:py${{ matrix.python }}"

          # `:latest` floats with the SPEC 0 floor (currently 3.12 — see
          # tooling/methods/python/README.md). Bump the conditional below
          # when the floor bumps so the floating tag follows.
          if [ "${{ matrix.python }}" = "3.12" ]; then
            tags="$tags
          ghcr.io/fabbs-tech/python-container:latest"
          fi

          if [ -n "${{ inputs.extra_tag }}" ]; then
            tags="$tags
          ghcr.io/fabbs-tech/python-container:${{ inputs.extra_tag }}-py${{ matrix.python }}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # provenance:false / sbom:false: by default buildx wraps each tag
      # in an OCI image index that references a platform manifest *and*
      # an attestation manifest (os/arch unknown/unknown). GHCR exposes
      # the index as "tagged" but the referenced manifests appear as
      # untagged package versions — and the cleanup workflow's
      # delete-package-versions@v5 is not reference-aware, so it prunes
      # them as orphans and the next pull of :latest fails with
      # `manifest unknown`. Disabling both flattens each tag to a single
      # platform manifest, making the existing cleanup safe. See
      # tooling/dev_notes/log/ghcr_manifest_unknown_oci_index_cleanup.md.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
          # Per-version cache scope so 3.12 and 3.13 don't fight over
          # the same cache slot.
          cache-from: type=gha,scope=py${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=py${{ matrix.python }}
