name: Cleanup old container versions

# ghcr.io has no declarative retention policy, so every push to `main`
# that rebuilds a tag leaves the previous version as an untagged
# orphan. Prune them weekly. Tagged versions (`:py3.12`, `:py3.13`,
# `:latest`, manual workflow_dispatch tags) are kept forever.

on:
  schedule:
    # Sunday 03:00 UTC — quiet for the team, doesn't clash with builds.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune-untagged:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: python-container
          package-type: container
          owner: fabbs-tech
          delete-only-untagged-versions: true
          # Safety buffer: even among untagged, retain the most recent
          # few in case a rollback is needed.
          min-versions-to-keep: 3